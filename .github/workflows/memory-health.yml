name: memory-health

# Two repos' worth of memory are gated here, and both matter:
#   * the shipped example, which is what a consumer copies, and
#   * this repo's own memory, because a memory tool whose own repo keeps its memory in a
#     file nothing checks is the first thing a skeptical reader notices.
# Both exercise the PUBLISHED action, resolved by tag (`uses: ...@v1`) with no vendored
# copy, and both pass a real `--since`, which is the only way dead-ends-settled can see
# what a change actually touched.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Not needed for drift detection -- that is content-based, so a squashed or
          # shallow history still fails correctly. It IS needed so the base sha of a PR
          # exists locally, otherwise --since cannot resolve and the gate fails closed.
          fetch-depth: 0

      - name: MEMORY-HEALTH for the shipped example
        uses: Rudra5417/agentlore@v1
        with:
          working-directory: examples/billing-service
          compile-in-sync: "true"
          # A boundary always. On a PR it is the base sha; on a push to main it is the sha
          # that was at the tip before this push. `github.event.before` is 40 zeros on a NEW
          # branch, which is exactly the unresolvable ref the tool refuses to accept -- and
          # this workflow only pushes to main, where it is always a real commit.
          since: ${{ github.event.pull_request.base.sha || github.event.before }}

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: MEMORY-HEALTH for agentlore's own memory
        uses: Rudra5417/agentlore@v1
        with:
          compile-in-sync: "true"
          since: ${{ github.event.pull_request.base.sha || github.event.before }}
