name: tests

# Four jobs, because they answer different questions:
#   tests  -- does agentlore behave the way it claims?
#   example -- does the shipped example pass its own memory gate in CI, the way a
#              real repo would? This is the tool used on itself.
#   action -- does the action work the way a consumer will use it, in BOTH directions?
#             A gate nobody has watched fail is decoration.
#   bench  -- are the two arms of the behaviour benchmark still identical apart from
#             the memory? No model calls, so it is free. Without this, an edit to the
#             fixture or the seeder could make the arms differ by something else and
#             every number the benchmark produces would measure the wrong variable.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check (stdlib only, no dependencies to install)
        run: python3 -m py_compile agentlore
      - name: Run the suite
        run: python3 run_tests.py

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The example passes its own memory gate
        working-directory: examples/billing-service
        run: |
          python3 tools/agentlore index
          python3 tools/agentlore check --brief
      - name: The vendored copy matches the tool at the root
        # A drift here means the example is demonstrating a tool nobody is shipping.
        run: cmp agentlore examples/billing-service/tools/agentlore
      - name: Generated AGENTS.md is committed in sync
        working-directory: examples/billing-service
        run: |
          python3 tools/agentlore compile
          git diff --exit-code AGENTS.md

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check the harness
        run: python3 -m py_compile bench/harness.py bench/run_trial.py bench/loop.py
      - name: Build both arms and assert they differ only by the memory
        # Every fixture, not just the default one: a fixture whose arms differ by something
        # other than the memory measures the wrong variable, and that must fail here rather
        # than silently produce a publishable number.
        run: |
          for f in $(ls bench/fixtures); do
            echo "--- fixture: $f ---"
            python3 bench/run_trial.py --fixture "$f" --dry-run
          done
      - name: Loop plumbing (no model calls)
        run: python3 bench/loop.py --dry-run

  # The action is what strangers actually consume, so it is exercised the way a consumer
  # uses it: `uses: ./` resolves this repo's action.yml at the root, with no vendored copy.
  # Both outcomes are asserted -- green on healthy memory, red on broken memory -- so a
  # change that quietly turns the gate into a no-op fails the build here.
  #
  # It runs against examples/action-fixture, a deliberately boring always-green fixture,
  # and NOT against the demo example. Decoupling matters: pointing this job at the demo
  # would make it inherit that example's memory health, so any branch that legitimately
  # breaks the demo's memory (exactly what the gate exists to catch) would also fail here,
  # for the wrong reason. memory-health.yml gates the demo; this job tests the action.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The action passes a healthy gate
        uses: ./
        with:
          working-directory: examples/action-fixture
          compile-in-sync: "true"

      - name: Break it -- change the code under a memory and leave the memory alone
        working-directory: examples/action-fixture
        run: |
          # A real semantic change, deliberately NOT a comment-only edit: the tool treats a
          # reformat or a comment-only change as a notice rather than a failure, so
          # appending "# drift" would prove nothing at all about the gate.
          printf 'def thing():\n    return 2\n' > src/thing.py

      - name: The action must now fail
        id: broken
        continue-on-error: true
        uses: ./
        with:
          working-directory: examples/action-fixture

      - name: Assert it failed
        run: |
          if [ "${{ steps.broken.outcome }}" != "failure" ]; then
            echo "::error::the action passed on broken memory, so the gate is decoration"
            exit 1
          fi
          echo "The action failed on broken memory, as it should."

