name: agentlore - memory health
description: "Repo memory for coding agents: fail the gate when code moved under a memory and the memory did not."
author: Rudra Patel

branding:
  icon: book-open
  color: purple

inputs:
  since:
    description: >-
      Commit or ref that this change starts from (use the PR base sha). Required for the
      dead-ends-settled check to see what this change touched; without it that check cannot
      tell, so it is reported as NOT RUN and excluded from the score rather than counted as
      a pass. A silent check is a disabled check.
    required: false
    default: ""
  require-since:
    description: >-
      Fail when 'since' is empty. Without a boundary the change-scoped check cannot see what
      this change touched, so it reports not-run and is excluded from the score: the gate is
      green having checked less than it claims. Turn this off only if you deliberately want
      the static checks alone.
    required: false
    default: "true"
  github:
    description: Emit check-run annotations anchored on the diff, plus a job summary table.
    required: false
    default: "true"
  fail-on-broken:
    description: >-
      Fail the step when MEMORY-HEALTH is broken. Set to false to report without blocking
      (the run then always succeeds, so do not use that as your merge gate).
    required: false
    default: "true"
  compile-in-sync:
    description: >-
      Also assert the committed AGENTS.md matches what `agentlore compile` generates. Requires
      AGENTS.md to be tracked, otherwise the comparison would pass vacuously.
    required: false
    default: "false"
  working-directory:
    description: Directory containing .memory/ (the repository root by default).
    required: false
    default: "."

runs:
  using: composite
  steps:
    # A green gate that skipped a check is the failure this tool exists to catch, so refuse
    # to run blind by default rather than warning about it and passing anyway.
    - name: A boundary is required
      if: ${{ inputs.require-since == 'true' }}
      shell: bash
      run: |
        if [ -z "${{ inputs.since }}" ]; then
          echo "::error::'since' is empty and require-since is true, so the change-scoped check would never run and this gate would be green having checked less than it claims. Pass the boundary -- on a pull_request the base sha, on a push the sha that was at the tip before it -- or set require-since: false to run the static checks alone."
          exit 1
        fi

    # .memory/index.db is gitignored: a derived build artifact, never reviewed, never
    # merged. It is rebuilt from the markdown here every run, which also exercises the
    # index-fresh check instead of trusting a stale committed index.
    - name: Rebuild the derived index
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: python3 "${{ github.action_path }}/agentlore" index

    - name: MEMORY-HEALTH
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # A gate that cannot see is not a gate. With no boundary the change-scoped check
        # cannot run, so say so loudly rather than letting a green run imply it passed.
        if [ -z "${{ inputs.since }}" ]; then
          echo "::warning title=MEMORY-HEALTH is running blind::'since' is empty, so dead-ends-settled cannot see what this change touched and is reported as not run, not as a pass. Pass the pull_request base sha on a PR, or the pre-push sha on a push."
        fi
        args=(check)
        if [ "${{ inputs.github }}" = "true" ]; then args+=(--github); fi
        if [ -n "${{ inputs.since }}" ]; then args+=(--since "${{ inputs.since }}"); fi
        code=0
        python3 "${{ github.action_path }}/agentlore" "${args[@]}" || code=$?
        if [ "$code" -ne 0 ]; then
          if [ "${{ inputs.fail-on-broken }}" = "true" ]; then
            exit "$code"
          fi
          echo "::warning::MEMORY-HEALTH is broken but fail-on-broken is false, so this run passes anyway."
        fi

    # Typed fragments are the source of truth; AGENTS.md is a build target. If they
    # disagree, the committed AGENTS.md is lying to every agent that reads it.
    - name: AGENTS.md is in sync with .memory/
      if: ${{ inputs.compile-in-sync == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        python3 "${{ github.action_path }}/agentlore" compile > /dev/null
        if ! git ls-files --error-unmatch AGENTS.md > /dev/null 2>&1; then
          echo "::error::AGENTS.md is not tracked, so an out-of-sync build cannot be detected (git diff is silent on untracked files). Commit it, or set compile-in-sync: false."
          exit 1
        fi
        git diff --exit-code AGENTS.md
